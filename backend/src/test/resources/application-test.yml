spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:mysql://localhost:3306/moment_test?serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: false
        use_sql_comments: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
    mongodb:
      host: 127.0.0.1
      port: 27017
      database: moment_test

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cloud:
    aws:
      s3:
        bucket: merry-moment
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      stack:
        auto: false

server:
  port: 8080
  name: test_server

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000  # 1일 (밀리초)
  refresh-token-expiration: 604800000  # 7일 (밀리초)

app:
  email:
    verification-url: "http://localhost:8080/api/auth/verify-email"
    password-reset-url: "http://localhost:8080/api/auth/reset-password"
  oauth2:
    redirect-uri: "http://localhost:3000/oauth2/callback"
  cors:
    allowed-origins: "http://localhost:3000"
