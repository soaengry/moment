spring:

  datasource:
    url: jdbc:mysql://localhost:3306/moment?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: false
        use_sql_comments: true
    open-in-view: false
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000  # 1일 (밀리초)
  refresh-token-expiration: 604800000  # 7일 (밀리초)

app:
  frontend-url: ${FRONTEND_URL}
  password-reset-token-expiration: 3600000  # 1시간
  max-devices-per-user: 5
  email:
    verification-url: http://localhost:3000/verify-email
    password-reset-url: http://localhost:3000/reset-password
    
logging:
  level:
    com.soaengry.moment: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
