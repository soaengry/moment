spring:
  profiles:
    active: local
    group:
      local: local, common
      blue: blue, common
      green: green, common
  config:
    import: optional:file:.env[.properties]

server:
  env: blue

---

spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: "${LOCAL_BASE_URL}/login/oauth2/code/kakao"
          naver:
            redirect-uri: "${LOCAL_BASE_URL}/login/oauth2/code/naver"
          google:
            redirect-uri: "${LOCAL_BASE_URL}/login/oauth2/code/google"

server:
  port: 8080
  serverAddress: localhost

app:
  email:
    verification-url: "${LOCAL_BASE_URL}/verify-email"
    password-reset-url: "${LOCAL_BASE_URL}/reset-password"
  oauth2:
    redirect-uri: "${LOCAL_FRONT_URL}/oauth2/callback"

serverName: local_server

---

spring:
  config:
    activate:
      on-profile: blue
  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: "${PROD_BASE_URL}/login/oauth2/code/kakao"
          naver:
            redirect-uri: "${PROD_BASE_URL}/login/oauth2/code/naver"
          google:
            redirect-uri: "${PROD_BASE_URL}/login/oauth2/code/google"

server:
  port: 8080
  serverAddress: 13.124.50.98

app:
  email:
    verification-url: "${PROD_BASE_URL}/verify-email"
    password-reset-url: "${PROD_BASE_URL}/reset-password"
  oauth2:
    redirect-uri: "${PROD_FRONT_URL}/oauth2/callback"

serverName: blue_server

---

spring:
  config:
    activate:
      on-profile: green
  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: "${PROD_BASE_URL}/login/oauth2/code/kakao"
          naver:
            redirect-uri: "${PROD_BASE_URL}/login/oauth2/code/naver"
          google:
            redirect-uri: "${PROD_BASE_URL}/login/oauth2/code/google"

server:
  port: 8081
  serverAddress: 13.124.50.98

app:
  email:
    verification-url: "${PROD_BASE_URL}/verify-email"
    password-reset-url: "${PROD_BASE_URL}/reset-password"
  oauth2:
    redirect-uri: "${PROD_FRONT_URL}/oauth2/callback"

serverName: green_server

---

spring:
  config:
    activate:
      on-profile: common
  datasource:
    url: jdbc:mysql://localhost:3306/moment?serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: false
        use_sql_comments: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-name: Naver
            scope:
              - name
              - email

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  cloud:
    aws:
      s3:
        bucket: ${AWS_BUCKET}
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}
      region:
        static: ${AWS_REGION}
      stack:
        auto: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000  # 1일 (밀리초)
  refresh-token-expiration: 604800000  # 7일 (밀리초)

app:
  password-reset-token-expiration: 3600000  # 1시간
  max-devices-per-user: 5

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
