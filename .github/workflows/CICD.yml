name: CI-CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Set Docker Tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "DOCKER_TAG=latest" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/moment_server:${{ env.DOCKER_TAG }} \
            -f backend/Dockerfile .

      - name: Push Docker
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/moment_server:${{ env.DOCKER_TAG }}

  #################################################
  # ✅ 운영 서버 배포 (main 브랜치 전용)
  #################################################
  deploy-prod:
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set target upstream
        run: |
          STATUS=$(curl -o /dev/null -w "%{http_code}" "http://${{ secrets.MOMENT_SERVER_IP }}/env")
          if [ $STATUS = 200 ]; then
            CURRENT_UPSTREAM=$(curl -s "http://${{ secrets.MOMENT_SERVER_IP }}/env")
          else
            CURRENT_UPSTREAM=green
          fi

          echo CURRENT_UPSTREAM=$CURRENT_UPSTREAM >> $GITHUB_ENV

          if [ $CURRENT_UPSTREAM = blue ]; then
            echo "CURRENT_PORT=8080" >> $GITHUB_ENV
            echo "STOPPED_PORT=8081" >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=green" >> $GITHUB_ENV
          else
            echo "CURRENT_PORT=8081" >> $GITHUB_ENV
            echo "STOPPED_PORT=8080" >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=blue" >> $GITHUB_ENV
          fi

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem

      - name: Deploy to Prod Server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key.pem ubuntu@${{ secrets.MOMENT_SERVER_IP }} \
          "sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/moment_server:latest && \
           sudo docker compose -f docker-compose-${{ env.TARGET_UPSTREAM }}.yml up -d"

      - name: Health Check
        uses: jtalk/url-health-check-action@v4
        with:
          url: http://${{ secrets.MOMENT_SERVER_IP }}:${{ env.STOPPED_PORT }}/env
          max-attempts: 5
          retry-delay: 10s

      - name: Change Nginx Upstream
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key.pem ubuntu@${{ secrets.MOMENT_SERVER_IP }} \
          "sudo cp /home/ubuntu/upstream-${{ env.TARGET_UPSTREAM }}.inc /home/ubuntu/upstream.inc && \
           sudo docker exec moment-nginx nginx -s reload"

      - name: Cleanup SSH key
        run: rm -f ssh_key.pem


  #################################################
  # ✅ 테스트 서버 배포 (dev 브랜치 전용)
  #################################################
  deploy-dev:
    if: github.ref_name == 'dev'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem

      - name: Deploy to Dev Server
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key.pem ubuntu@${{ secrets.DEV_SERVER_IP }} \
          "sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/moment_server:dev && \
           sudo docker compose -f docker-compose-dev.yml up -d"

      - name: Cleanup SSH key
        run: rm -f ssh_key.pem
